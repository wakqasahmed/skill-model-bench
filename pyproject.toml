[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-model-bench"
version = "0.1.0"
description = "Benchmark any AI model against any agent skill, using the skill's own fixtures as ground truth"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Wakqas Ahmed" }]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
skill-model-bench = "skill_model_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
